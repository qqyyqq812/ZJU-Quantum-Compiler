services:
  - type: web
    name: zju-quantum-compiler-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-mcp.txt
    startCommand: uvicorn src.server.mcp_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
